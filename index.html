<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finex Express | تسویه فوری USDC</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #e5b842;
            --accent-gold-hover: #f5cb5c;
            --text-light: #f1f1f1;
            --text-dim: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            margin-bottom: 10px;
        }

        .header h1 {
            color: var(--accent-gold);
            font-size: 1.5rem;
            font-weight: 800;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--accent-gold);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-gold);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--accent-gold-hover);
        }

        .rate-badge {
            background: rgba(229, 184, 66, 0.1);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .result-box {
            background: #181818;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            border: 1px dashed var(--border-color);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px solid #2a2a2a;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .hidden {
            display: none;
        }

        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #282828;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .logout-btn {
            color: #ff5555;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="finex-logo.png" alt="Finex Logo">
        <h1>FINEX EXPRESS</h1>
        <p>تسویه سریع و امن USDC</p>
    </div>

    <!-- Registration / Login Form -->
    <div id="auth-section">
        <div class="form-group">
            <label for="user-firstname">نام</label>
            <input type="text" id="user-firstname" placeholder="مثال: علی">
        </div>
        <div class="form-group">
            <label for="user-lastname">نام خانوادگی</label>
            <input type="text" id="user-lastname" placeholder="مثال: محمدی">
        </div>
        <div class="form-group">
            <label for="user-email">ایمیل</label>
            <input type="email" id="user-email" placeholder="مثال: example@gmail.com">
        </div>
        <button class="btn" onclick="handleLogin()">ثبت و ورود به سیستم</button>
    </div>

    <!-- Main Calculation Panel -->
    <div id="app-section" class="hidden">
        <div class="user-info-bar">
            <span>خوش آمدید، <b id="display-user-name"></b></span>
            <span class="logout-btn" onclick="handleLogout()">خروج</span>
        </div>

        <div class="rate-badge">
            نرخ لحظه‌ای USDC: <span id="current-rate">در حال دریافت...</span> تومان
        </div>

        <div class="form-group">
            <label for="usdc-amount">مبلغ USDC را وارد کنید:</label>
            <input type="number" id="usdc-amount" placeholder="مثال: 100" oninput="calculate()">
        </div>

        <div class="result-box">
            <div class="result-row">
                <span>معادل کل:</span>
                <span id="total-toman">0 تومان</span>
            </div>
            <div class="result-row">
                <span>کارمزد تسویه:</span>
                <span id="fee-toman">0 تومان</span>
            </div>
            <div class="result-row">
                <span>مبلغ قابل دریافت:</span>
                <span id="final-toman">0 تومان</span>
            </div>
        </div>

        <button class="btn" onclick="sendToSupport()">تأیید و دریافت کد تسویه</button>
    </div>
</div>

<script>
    let currentRate = 100000;
    const supportUsername = "FinexPay_Support";

    async function fetchLiveRate() {
        try {
            const response = await fetch('https://api.nobitex.ir/v2/orderbook/USDTIRT');
            const data = await response.json();
            if (data && data.lastTradePrice) {
                currentRate = Math.round(Number(data.lastTradePrice) / 10);
                document.getElementById('current-rate').innerText = currentRate.toLocaleString('fa-IR');
                calculate();
            }
        } catch (e) {
            document.getElementById('current-rate').innerText = currentRate.toLocaleString('fa-IR');
        }
    }

    function checkAuth() {
        const user = localStorage.getItem('finex_user');
        if (user) {
            const userData = JSON.parse(user);
            document.getElementById('display-user-name').innerText = userData.firstName + ' ' + userData.lastName;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            fetchLiveRate();
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
        }
    }

    function handleLogin() {
        const firstName = document.getElementById('user-firstname').value.trim();
        const lastName = document.getElementById('user-lastname').value.trim();
        const email = document.getElementById('user-email').value.trim();

        if (!firstName || !lastName || !email) {
            alert('لطفاً تمامی موارد (نام، نام خانوادگی و ایمیل) را وارد کنید.');
            return;
        }

        localStorage.setItem('finex_user', JSON.stringify({ firstName, lastName, email }));
        checkAuth();
    }

    function handleLogout() {
        localStorage.removeItem('finex_user');
        checkAuth();
    }

    function calculate() {
        const amount = parseFloat(document.getElementById('usdc-amount').value) || 0;
        const total = amount * currentRate;
        const fee = total * 0.01;
        const finalAmount = total - fee;

        document.getElementById('total-toman').innerText = Math.round(total).toLocaleString('fa-IR') + ' تومان';
        document.getElementById('fee-toman').innerText = Math.round(fee).toLocaleString('fa-IR') + ' تومان';
        document.getElementById('final-toman').innerText = Math.round(finalAmount).toLocaleString('fa-IR') + ' تومان';
    }

    function sendToSupport() {
        const user = JSON.parse(localStorage.getItem('finex_user'));
        const amount = document.getElementById('usdc-amount').value;

        if (!amount || amount <= 0) {
            alert('لطفاً مبلغ معتبری وارد کنید.');
            return;
        }

        const total = amount * currentRate;
        const finalAmount = total - (total * 0.01);
        const orderCode = 'FNX-' + Math.floor(100000 + Math.random() * 900000);

        const message = `سلام، درخواست تسویه جدید دارید:%0A%0A` +
            `👤 کاربر: ${user.firstName} ${user.lastName}%0A` +
            `📧 ایمیل: ${user.email}%0A` +
            `🔖 کد پیگیری: ${orderCode}%0A` +
            `💵 مبلغ: ${amount} USDC%0A` +
            `📈 نرخ محاسباتی: ${currentRate.toLocaleString('fa-IR')} تومان%0A` +
            `💳 دریافتی خالص: ${Math.round(finalAmount).toLocaleString('fa-IR')} تومان`;

        window.open(`https://t.me/${supportUsername}?text=${message}`, '_blank');
    }

    checkAuth();
</script>

</body>
</html>
